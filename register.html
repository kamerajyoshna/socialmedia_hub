<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ConnectHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="container">
    <div class="card auth-box">
      <h2 style="margin-bottom: 20px;">Create an Account</h2>
      <div id="error-container"></div>
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" required placeholder="Alex Johnson">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="alexj">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="alex@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Register</button>
      </form>
      <p style="margin-top: 16px; color: var(--text-muted); text-align: center;">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { initAuthGuard, renderNav } from './js/auth.js';
    import { request, setSession } from './js/api.js';

    initAuthGuard(false);
    renderNav();

    const form = document.getElementById('register-form');
    const errContainer = document.getElementById('error-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errContainer.innerHTML = '';
      try {
        const data = await request('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            fullName: document.getElementById('fullName').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
          })
        });
        setSession(data.token, data.user);
        window.location.href = 'home.html';
      } catch (err) {
        errContainer.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
